<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Avatar visual verification</title><style>html,body{margin:0;width:100%;height:100%;background:#dce7ed}canvas{width:100%;height:100%;display:block}#status{position:absolute;top:12px;left:12px;font:16px sans-serif;color:#193047}#hair-controls{position:absolute;bottom:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px;padding:10px;background:#fffffff0;border-radius:12px;font:13px sans-serif}label{display:flex;flex-direction:column;gap:4px}select,button{padding:6px;border:1px solid #bccbd5;border-radius:6px}button{align-self:end;background:#e3f2e6}</style></head><body><div id="status">Avatar — front / farmer / daylight</div><form id="hair-controls" method="get">
<label>Avatar<select name="gender"><option value="male">Nam</option><option value="female">Nữ</option></select></label>
<label>Kiểu tóc<select name="hair"><option value="hair_buzzcut">Đầu đinh</option><option value="hair_high_ponytail">Đuôi gà buộc cao</option><option value="hair_classic">Mặc định nam / nữ</option><option value="hair_slick_side">Mái lệch 7/3</option><option value="hair_anime_bangs">Two-block mềm</option><option value="hair_wavy_curly">Ngắn phồng nhẹ</option><option value="hair_chic_bob">Bob ngang cằm</option><option value="hair_celestial_flow">Dài ngang vai</option><option value="hair_twintails">Hai đuôi thấp</option><option value="hair_ponytail">Đuôi ngựa</option></select></label>
<label>Màu<select name="color"><option value="#76503b">Hạt dẻ</option><option value="#1e293b">Đen than</option><option value="#50352c">Chocolate</option><option value="#d9a852">Mật ong</option><option value="#d97096">Hồng pastel</option></select></label>
<label>Góc nhìn<select name="angle"><option value="front">Trước</option><option value="side">Ngang</option><option value="back">Sau</option><option value="game">Trong game</option></select></label>
<label>Chi tiết<select name="lod"><option value="0">Gần</option><option value="1">Vừa</option><option value="2">Xa</option></select></label>
<label>Chuyển động<select name="motion"><option value="idle">Đứng</option><option value="run">Chạy</option></select></label>
<label>Ánh sáng<select name="light"><option value="day">Ngày</option><option value="night">Đêm</option></select></label><button type="submit">Xem tóc</button></form><canvas id="view"></canvas><script type="module" src="/src/game/testing/avatarPreview.js"></script></body></html>
