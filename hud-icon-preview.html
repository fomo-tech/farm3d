<!doctype html><html lang="vi"><meta charset="utf-8"><title>Bộ icon HUD 3D</title><style>body{background:#dae4ea;color:#233f50;font:16px sans-serif;padding:24px}main{display:grid;grid-template-columns:repeat(6,140px);gap:16px}figure{margin:0;background:#f8fafb;border-radius:20px;padding:8px;text-align:center}img{width:112px;height:112px}</style><h1>HUD · vật thể 3D</h1><main id="icons"></main><script type="module">import {renderHudIcons} from '/src/game/art/renderHudIcons.js';renderHudIcons().then(icons=>{for(const [name,src] of Object.entries(icons)){const f=document.createElement('figure');const i=document.createElement('img');i.src=src;i.dataset.icon=name;f.append(i);const c=document.createElement('figcaption');c.textContent=name;f.append(c);document.querySelector('main').append(f);}}).catch(error=>{document.querySelector('main').textContent='Không render được icon: '+error.message;});</script></html>
