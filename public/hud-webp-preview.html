<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Icon HUD WebP</title>
<style>body{margin:0;padding:20px;background:#e5f2f2;color:#183e50;font:14px system-ui}h1{font-size:22px}main{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.tile{background:#fff;border-radius:18px;padding:10px;text-align:center}.samples{display:flex;align-items:center;justify-content:center;gap:12px}.large{width:92px;height:92px;object-fit:contain}.small{width:40px;height:40px;object-fit:contain;background:#294c5b;border-radius:12px;padding:5px}p{margin:6px 0 0}@media(max-width:700px){main{grid-template-columns:repeat(3,1fr)}}</style>
<h1>Bộ icon HUD — WebP trong suốt</h1><main id="icons"></main>
<script>const names=['backpack','wardrobe','camera','phone','coin','gem','quest','bike','chat','emote','land','sprint','jump','hand','fish','gate','basket','seeds','map','shop','settings'];document.getElementById('icons').innerHTML=names.map(name=>`<div class="tile"><div class="samples"><img class="large" src="/assets/hud/farm-v2/${name}.webp" alt="${name}"><img class="small" src="/assets/hud/farm-v2/${name}.webp" alt=""></div><p>${name}</p></div>`).join('');</script></html>
