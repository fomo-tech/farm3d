<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0284c7">
<title>Kiểm tra vùng hiển thị Chrome</title>
<style>
html { background:#0284c7; }
body { margin:0; min-height:100vh; min-height:100dvh; background:#0284c7; color:white; font:16px system-ui; }
main { box-sizing:border-box; min-height:100vh; min-height:100dvh; border:4px solid #facc15; padding:20px; }
pre { white-space:pre-wrap; font-size:12px; }
a { color:white; }
</style>
</head>
<body><main>
<h1>Kiểm tra màn hình ngang</h1>
<p>Toàn bộ vùng trang phải màu xanh và có viền vàng. Trang này không chạy game.</p>
<pre id="metrics"></pre>
<a href="/?v=rotation15">Trở lại game</a>
</main>
<script>
function measure() {
 const r=document.querySelector('main').getBoundingClientRect(),v=window.visualViewport;
 const sample={buildRevision:2026100509,time:Date.now(),layoutWidth:innerWidth,layoutHeight:innerHeight,
 rootX:r.x,rootY:r.y,rootWidth:r.width,rootHeight:r.height,
 viewportWidth:v?.width,viewportHeight:v?.height,viewportLeft:v?.offsetLeft,viewportTop:v?.offsetTop,
 viewportScale:v?.scale,nativeDpr:devicePixelRatio};
 document.getElementById('metrics').textContent=JSON.stringify(sample,null,2);
 fetch('/__mobile-diagnostics',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(sample)}).catch(()=>{});
}
addEventListener('resize',measure);addEventListener('orientationchange',()=>{measure();setTimeout(measure,600);});
window.visualViewport?.addEventListener('resize',measure);measure();
</script>
</body></html>
