<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#38bdf8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800;900&family=Nunito:wght@700;800;900&subset=vietnamese&display=swap" rel="stylesheet" />
    <title>Vibe City - Nông Trại Online 3D</title>
    <!-- CRITICAL CSS: Prevents FOUC on desktop & mobile while modules load -->
    <style id="critical-guard-css">
      #landscape-guard {
        display: none !important;
      }
      @keyframes ptSplashPulse {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.04); opacity: 1; }
      }
      @keyframes ptSplashDot {
        0%, 100% { transform: translateY(0); opacity: 0.35; }
        50% { transform: translateY(-7px); opacity: 1; }
      }
    </style>
  </head>
  <body style="margin: 0; background: #38bdf8; overflow: hidden;">
    <div id="root">
      <!-- Instant preloader displayed before React mounts; replaced immediately on render -->
      <div id="initial-splash" style="position:fixed;inset:0;z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%, #38bdf8 0%, #0284c7 45%, #0369a1 85%, #0c4a6e 100%);color:#ffffff;font-family:'Baloo 2','Nunito',system-ui,-apple-system,sans-serif;user-select:none;text-align:center;padding:20px;">
        <div style="font-size:clamp(36px, 7vw, 54px);font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:#ffffff;text-shadow:0 3px 0 #0284c7, 0 6px 0 #0369a1, 0 14px 28px rgba(0,0,0,0.35);animation:ptSplashPulse 2.2s infinite ease-in-out;">VIBE CITY</div>
        <div style="font-size:clamp(14px, 3vw, 16px);font-weight:800;color:#e0f2fe;letter-spacing:0.5px;margin-top:2px;margin-bottom:28px;text-shadow:0 2px 4px rgba(0,0,0,0.25);">Thế Giới Nông Trại 3D Trực Tuyến</div>
        <div style="display:flex;gap:10px;align-items:center;">
          <span style="width:11px;height:11px;border-radius:50%;background:#fde047;box-shadow:0 0 10px #fde047;animation:ptSplashDot 1.1s infinite ease-in-out 0s;"></span>
          <span style="width:11px;height:11px;border-radius:50%;background:#fde047;box-shadow:0 0 10px #fde047;animation:ptSplashDot 1.1s infinite ease-in-out 0.2s;"></span>
          <span style="width:11px;height:11px;border-radius:50%;background:#fde047;box-shadow:0 0 10px #fde047;animation:ptSplashDot 1.1s infinite ease-in-out 0.4s;"></span>
        </div>
      </div>
    </div>

    <!-- Authentic Play Together Landscape Orientation Guard (Mobile Portrait Only) -->
    <section id="landscape-guard" class="pt-landscape-guard" aria-live="polite">
      <!-- Decorative Floating Background Clouds & Stars -->
      <div class="pt-guard-bg-elements" aria-hidden="true">
        <div class="pt-guard-cloud pt-cloud-1"></div>
        <div class="pt-guard-cloud pt-cloud-2"></div>
        <div class="pt-guard-cloud pt-cloud-3"></div>
        <div class="pt-guard-star pt-star-1">✦</div>
        <div class="pt-guard-star pt-star-2">★</div>
        <div class="pt-guard-star pt-star-3">✦</div>
      </div>

      <!-- Main Play Together Modal Card -->
      <div class="pt-guard-card">
        <!-- Top Pill Tag -->
        <div class="pt-guard-pill">
          <span class="pt-guard-pill-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" fill="#fde047" stroke="#ca8a04" stroke-width="1.5"/></svg>
          </span>
          <span>VIBE CITY · CHẾ ĐỘ TOÀN MÀN HÌNH</span>
        </div>

        <!-- Animated Device Stage with Vector Phone & Orbit Arrows -->
        <div class="pt-guard-stage">
          <div class="pt-guard-device-wrap">
            <div class="pt-guard-device">
              <div class="pt-device-notch"></div>
              <div class="pt-device-screen">
                <div class="pt-mini-scene">
                  <div class="pt-mini-sun"></div>
                  <div class="pt-mini-cloud"></div>
                  <div class="pt-mini-hill"></div>
                  <svg class="pt-mini-svg-house" width="34" height="34" viewBox="0 0 36 36" fill="none" style="position: absolute; bottom: 8px; right: 8px; z-index: 4;">
                    <polygon points="18,4 32,16 4,16" fill="#ef4444" stroke="#991b1b" stroke-width="1.5" />
                    <rect x="7" y="16" width="22" height="16" rx="2" fill="#fef3c7" stroke="#78350f" stroke-width="1.5" />
                    <rect x="14" y="22" width="8" height="10" rx="1" fill="#78350f" />
                  </svg>
                </div>
              </div>
              <div class="pt-device-glare"></div>
            </div>
            <!-- Orbit Arrow Indicator -->
            <svg class="pt-guard-orbit-arrow" viewBox="0 0 100 100" aria-hidden="true">
              <defs>
                <linearGradient id="ptArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#38bdf8" />
                  <stop offset="100%" stop-color="#fde047" />
                </linearGradient>
              </defs>
              <path d="M 22 75 A 40 40 0 0 1 76 22" fill="none" stroke="url(#ptArrowGrad)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="8 5" />
              <polygon points="78,14 88,26 73,28" fill="#fde047" />
            </svg>
          </div>
        </div>

        <!-- Headings & Content -->
        <h2 class="pt-guard-title">XOAY NGANG ĐỂ CHƠI</h2>
        <p class="pt-guard-desc">Trải nghiệm thị trấn Vibe City sống động, góc nhìn 3D bao quát và điều khiển mượt mà nhất khi xoay ngang máy.</p>

        <!-- Chunky 3D Candy CTA Button -->
        <div class="pt-guard-actions">
          <button id="landscape-start" class="pt-guard-btn-primary" type="button">
            <span class="btn-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="20" height="12" rx="4" fill="#38bdf8" stroke="#0284c7" stroke-width="1.8"/><circle cx="8" cy="12" r="2" fill="#ffffff"/><circle cx="16" cy="12" r="1.5" fill="#facc15"/><circle cx="18" cy="10" r="1.5" fill="#ef4444"/></svg>
            </span>
            <span>Vào Toàn Màn Hình</span>
          </button>
          <button id="landscape-dismiss" class="pt-guard-btn-secondary" type="button">
            Tiếp tục ở màn hình dọc
          </button>
        </div>

        <!-- Dynamic Device Hint -->
        <div id="landscape-device-hint" class="pt-guard-hint">
          <span class="hint-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2C8.13 2 5 5.13 5 9C5 11.38 6.19 13.47 8 14.74V17C8 17.55 8.45 18 9 18H15C15.55 18 16 17.55 16 17V14.74C17.81 13.47 19 11.38 19 9C19 5.13 15.87 2 12 2Z" fill="#fde047" stroke="#ca8a04" stroke-width="1.5"/><rect x="9" y="19" width="6" height="3" rx="1" fill="#94a3b8"/></svg>
          </span>
          <span class="hint-text">Xoay ngang điện thoại để khám phá ngay</span>
        </div>
      </div>
    </section>

    <script src="/orientation.js"></script>
    <script src="/mobile-debug.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
