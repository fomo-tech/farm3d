<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biển Bagbily</title><style>body{margin:0;background:#e8e7dc;min-height:100vh;display:grid;place-items:center}canvas{width:min(1100px,96vw);height:auto;box-shadow:0 20px 60px #293e3120;border-radius:14px}</style><canvas id="banner" width="1024" height="576"></canvas><script>function drawSponsorBanner(ctx, config, logo = null) {
  ctx.save();
  ctx.setTransform(0.5, 0, 0, 0.5, 0, 0);
  ctx.fillStyle = '#fffcf4';
  ctx.fillRect(0, 0, 2048, 1152);
  const rounded = (x, y, w, h, radius, color) => {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + w, y, x + w, y + h, radius);
    ctx.arcTo(x + w, y + h, x, y + h, radius);
    ctx.arcTo(x, y + h, x, y, radius);
    ctx.arcTo(x, y, x + w, y, radius);
    ctx.closePath();
    ctx.fill();
  };
  const label = (text, x, y, size, color, width, weight = 700) => {
    ctx.font = `${weight} ${size}px "Nunito", "Segoe UI", Arial, sans-serif`;
    ctx.fillStyle = color;
    ctx.fillText(text, x, y, width);
  };
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  rounded(120, 104, 12, 83, 6, '#f45222');
  label(config.brandName || 'Bagbily', 162, 146, 68, '#f45222', 900, 900);
  label('MUA SẮM · ĐỒNG HÀNH CÙNG GAME', 122, 245, 28, '#8a8b75', 1090, 700);

  if (config.mainHeadline === 'Mua sắm shopee qua Bagbily để hỗ trợ phát triển game') {
    label('Mua sắm shopee', 116, 419, 110, '#293e31', 1120, 800);
    label('qua Bagbily', 116, 556, 132, '#f45222', 1120, 900);
    label('để hỗ trợ phát triển game', 122, 685, 64, '#52664f', 1120, 600);
  } else {
    ctx.font = '800 86px "Nunito", "Segoe UI", Arial, sans-serif';
    const lines = [];
    let line = '';
    for (const word of String(config.mainHeadline || '').split(/\s+/)) {
      const next = line ? `${line} ${word}` : word;
      if (line && ctx.measureText(next).width > 1100) { lines.push(line); line = word; }
      else line = next;
    }
    if (line) lines.push(line);
    const size = Math.min(86, 300 / Math.max(1, lines.length));
    lines.forEach((text, index) => label(text, 122, 380 + index * (size + 22), size, '#293e31', 1100, 800));
  }
  rounded(120, 810, 730, 124, 34, '#e9dbc5');
  rounded(120, 800, 730, 124, 34, '#f45222');
  label('MUA SẮM QUA BAGBILY', 168, 862, 37, '#fffdf7', 590, 800);
  label('↗', 752, 862, 60, '#fffdf7', 70, 600);
  label('Chạm vào biển để mở', 120, 982, 29, '#8a8b75', 1120, 500);
  label('bagbily.com/hoantien-shopee', 120, 1060, 29, '#52664f', 1120, 600);

  const orange = ctx.createLinearGradient(1280, 0, 2048, 1152);
  orange.addColorStop(0, '#ffb55b');
  orange.addColorStop(1, '#f45222');
  ctx.fillStyle = orange;
  ctx.fillRect(1280, 0, 768, 1152);
  ctx.fillStyle = '#ffffff16';
  ctx.beginPath();
  ctx.arc(1980, 80, 340, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(1290, 1080, 270, 0, Math.PI * 2);
  ctx.fill();
  rounded(1376, 298, 574, 574, 58, '#ab3f2824');
  rounded(1376, 282, 574, 574, 58, '#fff7e8');
  if (logo) {
    ctx.save();
    rounded(1392, 298, 542, 542, 44, '#fff7e8');
    ctx.clip();
    ctx.drawImage(logo, 1392, 298, 542, 542);
    ctx.restore();
  } else {
    ctx.textAlign = 'center';
    label('Bagbily', 1663, 569, 76, '#f45222', 480, 900);
  }
  ctx.textAlign = 'center';
  label('BAGBILY', 1663, 965, 40, '#fff9ee', 650, 800);
  ctx.restore();
}

const ctx=document.getElementById('banner').getContext('2d');const config={brandName:'Bagbily',mainHeadline:'Mua sắm shopee qua Bagbily để hỗ trợ phát triển game'};drawSponsorBanner(ctx,config);const img=new Image();img.onload=()=>drawSponsorBanner(ctx,config,img);img.src='../public/assets/brands/bagbily-logo.png';</script></html>
